services:
  - type: web
    name: kumbhakaran-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kumbhakaran/backend build
    startCommand: node backend/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 871471875670-ifpho22l5oa0r59kgsvvuoe3r7t5a2l9.apps.googleusercontent.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
