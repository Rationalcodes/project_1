<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SLOON | Partner OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GIS) Web SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Block Google Translate Floating Logo & Spinners -->
    <style>
      .goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      div[class*="VIpgJd"],
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      .VIpgJd-ZVi9od-aZ2wEe,
      .goog-te-spinner-pos,
      .goog-te-spinner,
      .goog-te-gadget-icon,
      .goog-logo-link,
      #goog-gt-tt {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
    </style>

    <!-- Google Translate Website Integration (Zero manual dictionary files) -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,gu,bn,ta,te,kn,ml,pa,ur,or,as',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };

      // Mutation observer to immediately remove any injected floating Google logo widgets
      (function() {
        var observer = new MutationObserver(function(mutations) {
          var widgets = document.querySelectorAll('[class*="VIpgJd"], .goog-te-banner-frame, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf');
          for (var i = 0; i < widgets.length; i++) {
            var el = widgets[i];
            if (el && el.parentNode) {
              el.style.display = 'none';
              el.style.visibility = 'hidden';
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </head>
  <body class="bg-[#09090c] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-300">
    <!-- Google Translate Container (Hidden, controlled programmatically) -->
    <div id="google_translate_element" style="display: none !important;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
